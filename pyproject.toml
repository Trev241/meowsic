[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meowsic"
version = "0.1.0"
description = "Melody-preserving sample-based meow vocal rendering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
demucs = ["demucs>=4", "torchaudio>=2.6,<2.7", "soundfile>=0.12"]
youtube = ["yt-dlp>=2024.1.1"]
dashboard = ["gradio>=5"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["meowsic*"]
